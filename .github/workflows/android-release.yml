name: Release
on:
  push:
    tags:
      - '*'

env:
  ANDROID_PLATFORM_VERSION: '36'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_CMAKE_VERSION: '3.22.1'
  FFMPEG_KIT_VERSION: '9.0.2'

jobs:
  build-on-ubuntu-2604:
    name: android on ubuntu-26.04
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: set up temurin jdk 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config gettext autopoint \
            cmake bison meson ninja-build nasm yasm gperf ragel texinfo autogen \
            groff gtk-doc-tools libtasn1-6-dev tcl doxygen \
            gcc g++ make patch file findutils gawk rsync \
            python3 perl ruby curl wget git zip unzip xz-utils tar gzip sed grep diffutils \
            bash which

      - name: set up android sdk and ndk
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDK_MANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "${SDK_MANAGER}" --licenses >/dev/null || true
          "${SDK_MANAGER}" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          {
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: run the build script
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: |
          ./android.sh --disable-arch-arm-v7a-neon --enable-lib-cpu-features \
            --enable-gpl --enable-lib-android-media-codec --enable-lib-android-zlib \
            --enable-lib-dav1d --enable-lib-libxml2 --enable-lib-openssl

      - name: Move build artifact
        run: mv "prebuilt/bundle-android-aar-24-maven/com/arthenica/ffmpeg-kit-next/${FFMPEG_KIT_VERSION}/ffmpeg-kit-next-${FFMPEG_KIT_VERSION}.aar" animiru-ffmpeg-kit-${{ github.ref_name }}.aar

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: animiru-ffmpeg-kit ${{ github.ref_name }}
          body: |
            library version ${{ github.ref_name }}
          files: |
            animiru-ffmpeg-kit-${{ github.ref_name }}.aar
          draft: false
          prerelease: false

      - name: print build logs
        if: ${{ always() }}
        run: cat build.log