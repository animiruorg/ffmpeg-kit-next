plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

base {
    archivesName = "ffmpeg-kit-next"
}

def name = "ffmpeg-kit-next"
def version = "1.0.0"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = 'com.arthenica.ffmpegkit'
    }
    compileSdk 36

    defaultConfig {
        minSdk 24
        versionCode 240902
        versionName version
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["../libs"]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'enable.ffmpegkit.test.mode', 'true'
        }
    }
}

mavenPublishing {
    publishToMavenCentral()

    signAllPublications()

    coordinates("io.github.animiruorg", name, version)

    pom {
        name = "ffmpeg-kit-next"
        description = "Fork of https://github.com/arthenica/ffmpeg-kit-next for Animiru"
        inceptionYear = "2026"
        url = "https://github.com/animiruorg/ffmpeg-kit-next/"
        licenses {
            license {
                name = "GNU Lesser General Public License version 3"
                url = "https://opensource.org/license/lgpl-3-0"
                distribution = "https://www.gnu.org/licenses/lgpl-3.0.txt"
            }
        }
        developers {
            developer {
                id = "animiruorg"
                name = "Animiru Org"
                url = "https://github.com/animiruorg/"
            }
        }
        scm {
            url = "https://github.com/animiruorg/ffmpeg-kit-next/"
            connection = "scm:git:git://github.com/animiruorg/ffmpeg-kit-next.git"
            developerConnection = "scm:git:ssh://git@github.com/animiruorg/ffmpeg-kit-next.git"
        }
    }
}

dependencies {
    api 'com.arthenica:smart-exception-java:0.2.1'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    testImplementation "androidx.test.ext:junit:1.3.0"
    testImplementation 'org.json:json:20260522'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
